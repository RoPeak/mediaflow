name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: mediaflow-windows-x64
            archive: zip
          - os: ubuntu-latest
            artifact-name: mediaflow-linux-x64
            archive: tar
          - os: macos-latest
            artifact-name: mediaflow-macos-arm64
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -x -q

      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean mediaflow.spec

      - name: Smoke test packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./dist/mediaflow/mediaflow.exe --help
            ./dist/mediaflow/mediaflow.exe doctor
          else
            ./dist/mediaflow/mediaflow --help
            ./dist/mediaflow/mediaflow doctor
          fi

      - name: Create zip artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/mediaflow -DestinationPath "${{ matrix.artifact-name }}.zip"

      - name: Create tar artifact
        if: matrix.archive == 'tar'
        run: tar -czf "${{ matrix.artifact-name }}.tar.gz" -C dist mediaflow

      - name: Upload zip artifact
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          if-no-files-found: error

      - name: Upload tar artifact
        if: matrix.archive == 'tar'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.tar.gz
          if-no-files-found: error
