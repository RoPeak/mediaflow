name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest typer==0.12.3 -r requirements-release.txt
      - name: Install package (no GUI deps)
        run: python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -x -q
